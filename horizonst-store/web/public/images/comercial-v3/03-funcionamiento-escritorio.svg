<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Funcionamiento conceptual de HorizonST</title><desc id="descripcion">El trabajador lleva un tag. Se controla presencia, permanencia y descansos. Recibe avisos personales por vibración y pitidos. El supervisor consulta registros. El SOS envía una alerta al supervisor en la aplicación web.</desc><rect x="0" y="0" width="1600" height="660" rx="24" fill="#07151D" stroke="#40566B" stroke-width="2"/><text x="800.0" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#86F2EA">Esquema conceptual</text><rect x="50" y="100" width="330" height="300" rx="20" fill="#08233F" stroke="#40566B" stroke-width="2"/><text x="80" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#86F2EA">1</text><g transform="translate(215.0 212)" stroke="#86F2EA" stroke-width="4" fill="none" stroke-linejoin="round"><rect x="-31" y="-53" width="62" height="106" rx="9" fill="#F1F5F8"/><rect x="-12" y="-46" width="24" height="5" rx="2" fill="#08233F" stroke="none"/><circle cx="0" cy="-12" r="14" fill="#142638" stroke="none"/></g><text x="215.0" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#D8FBFF">Trabajador con</text><text x="215.0" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#D8FBFF">dispositivo personal</text><path d="M391 250h28m-10-10 10 10-10 10" fill="none" stroke="#86F2EA" stroke-width="4"/><rect x="440" y="100" width="330" height="300" rx="20" fill="#08233F" stroke="#40566B" stroke-width="2"/><text x="470" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#86F2EA">2</text><g transform="translate(605.0 212)" stroke="#86F2EA" stroke-width="4" fill="none" stroke-linejoin="round"><rect x="-55" y="-50" width="110" height="100" rx="26" fill="#F1F5F8"/><circle cx="0" cy="0" r="37" stroke="#6F8193" stroke-width="2"/></g><text x="605.0" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#D8FBFF">Presencia, permanencia</text><text x="605.0" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#D8FBFF">y descansos</text><path d="M781 250h28m-10-10 10 10-10 10" fill="none" stroke="#86F2EA" stroke-width="4"/><rect x="830" y="100" width="330" height="300" rx="20" fill="#08233F" stroke="#40566B" stroke-width="2"/><text x="860" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#86F2EA">3</text><g transform="translate(995.0 212)" stroke="#86F2EA" stroke-width="4" fill="none" stroke-linejoin="round"><rect x="-31" y="-53" width="62" height="106" rx="9" fill="#F1F5F8"/><rect x="-12" y="-46" width="24" height="5" rx="2" fill="#08233F" stroke="none"/><circle cx="0" cy="-12" r="14" fill="#142638" stroke="none"/><path d="M-45-20Q-60 0-45 20M45-20Q60 0 45 20"/></g><text x="995.0" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#D8FBFF">Aviso al trabajador</text><text x="995.0" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#D8FBFF">Vibración y pitidos</text><path d="M1171 250h28m-10-10 10 10-10 10" fill="none" stroke="#86F2EA" stroke-width="4"/><rect x="1220" y="100" width="330" height="300" rx="20" fill="#08233F" stroke="#40566B" stroke-width="2"/><text x="1250" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#86F2EA">4</text><g transform="translate(1385.0 212)" stroke="#86F2EA" stroke-width="4" fill="none" stroke-linejoin="round"><rect x="-58" y="-43" width="116" height="78" rx="6"/><path d="M-20 52H20M0 35V52M-37-17H31M-37-1H20M-37 15H9"/></g><text x="1385.0" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#D8FBFF">Supervisor</text><text x="1385.0" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#D8FBFF">Registros e historial</text><rect x="50" y="445" width="1500" height="155" rx="20" fill="#103A50" stroke="#40566B" stroke-width="2"/><text x="800.0" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#86F2EA">SOS del trabajador</text><text x="800.0" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#D8FBFF">Alerta al supervisor en la aplicación web</text><text x="800.0" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#D8FBFF">Representación funcional, no arquitectura técnica</text></svg>