<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="./" />
    <title>Mensajes MQTT | HorizonST</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>HorizonST · Mensajes</h1>
      <nav id="adminNavigation" aria-label="Administración"></nav>
    </header>
    <main>
      <section class="card">
        <h2>Últimos mensajes recibidos</h2>
        <div class="table-wrapper">
          <table id="messagesTable">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Gateway</th>
                <th>Tema</th>
                <th>Payload</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="table-empty" id="messagesEmpty">Sin mensajes MK4 en la consulta central (hasta 200). No incluye presencia ni tráfico crudo MKGW3.</div>
      </section>
    </main>
    <footer>&copy; <span id="year"></span> HorizonST</footer>
    <script src="./js/base.js"></script>
    <script type="module" src="./js/messages.js"></script>
  </body>
</html>
