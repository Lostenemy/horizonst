# No instalar este archivo directamente. No contiene un dominio decidido.
# Opción recomendada: virtual host administrativo dedicado, con TLS y control de acceso.
# Sustituir __HARDWARE_MANAGER_HOSTNAME__ solo tras aprobación operativa.
server {
    listen 443 ssl http2;
    server_name __HARDWARE_MANAGER_HOSTNAME__;

    # ssl_certificate /ruta/gestionada/por/certbot/fullchain.pem;
    # ssl_certificate_key /ruta/gestionada/por/certbot/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Opción temporal preferida antes de publicar: túnel SSH.
# ssh -N -L 3000:127.0.0.1:3000 deploy@SERVIDOR
# Abrir después http://127.0.0.1:3000 desde la estación autorizada.

# Una ruta bajo horizonst.es u horneo.horizonst.es requiere revisar primero
# colisiones de /api, cookies, CORS, CSP y X-Forwarded-Prefix. No se ofrece una
# location lista para pegar porque ambos hosts ya sirven aplicaciones con /api.
